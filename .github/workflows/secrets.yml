name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Refuse secrets and personal details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Selftest the gate
        run: python tools/secrets_gate.py --selftest
      - name: Scan the tree
        run: python tools/secrets_gate.py --check
